[package]
name = "hanji-update"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Hanji 자동 업데이트: GitHub Releases에서 새 버전을 찾아 내려받고, 서명을 확인한 뒤 앱을 바꾼다."

[dependencies]
# 앱과 같은 reqwest(rustls). 런타임은 이 크레이트가 호출마다 만든다(앱은 백그라운드 스레드에서 부른다).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
