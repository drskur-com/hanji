[tools]
rust = "latest"
sccache = "latest"
"cargo:cargo-watch" = "latest"
cmake = "latest"

[env]
# transcribe.cpp(ggml) C++ 소스의 UTF-8 주석을 한국어 Windows 기본 코드페이지(949)로 읽으면
# 주석 끝의 multibyte 문자가 개행을 삼켜 문법 오류가 난다. MSVC에 UTF-8 소스임을 알려 준다.
CL = "-utf-8"

# Vulkan SDK(transcribe-cpp의 vulkan·dynamic-backends 기능). VULKAN_SDK가 이미 있으면 그 값을,
# 없으면 기본 설치 경로를 쓴다. SDK를 다른 버전으로 옮겼다면 아래 기본값만 고치면 된다.
VULKAN_SDK = "{{env.VULKAN_SDK | default(value='C:/VulkanSDK/1.4.363.0')}}"
_.path = ["{{env.VULKAN_SDK}}/Bin"]

[tasks.check]
description = "빠른 타입 체크 (컴파일 X)"
run = "cargo check"

[tasks.dev]
description = "개발 모드 실행"
run = "cargo run"

[tasks.watch]
description = "코드 변경 시 자동 실행"
run = "cargo watch -w src -x run --poll"

[tasks.build-fast]
description = "빠른 증분 빌드"
env = { CARGO_INCREMENTAL = "1" }
run = "cargo build"

[tasks.bundle]
description = "번들 만들기 (target/release/bundle: macOS .app, Windows .msi·.exe)"
# crates.io의 cargo-bundle 대신 vendor/cargo-bundle 사본을 그대로 빌드해 쓴다(Windows 쪽 패치 포함).
# cargo-bundle은 현재 디렉터리의 Cargo.toml을 대상으로 삼으므로 실행 위치는 저장소 루트다.
# 앞쪽 `--release`는 cargo-bundle 자체를, `bundle` 뒤쪽 `--release`는 번들할 Hanji를 릴리스로 빌드한다.
# Windows 기본 형식 `msi`(msi 크레이트로 직접 만든다)는 Windows Installer가 열지 못한다(0x80004005,
# 오류 1620). WiX로 만드는 `wxsmsi` 형식을 쓴다. .NET SDK가 있어야 한다(없으면 `winget install Microsoft.DotNet.SDK.8`).
run = "cargo run --release --manifest-path vendor/cargo-bundle/Cargo.toml -- bundle --release --format wxsmsi"
# Windows: 만든 Hanji.msi를 자동 업데이트가 찾는 이름(Hanji-<버전>-x64.msi)으로 바꾼다.
run_windows = [
  "cargo run --release --manifest-path vendor/cargo-bundle/Cargo.toml -- bundle --release --format wxsmsi",
  "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/rename-msi.ps1",
]

[tasks.dmg]
description = "macOS: .app 서명 → dmg 만들기 (target/release/bundle/osx/Hanji-<버전>-arm64.dmg)"
# MACOS_SIGN_IDENTITY가 없으면 키체인에서 첫 Developer ID Application 인증서를 쓰고, 그것도 없으면
# ad-hoc 서명(-s -)한다. ad-hoc이면 받은 사람이 처음 한 번 시스템 설정 → 개인정보 보호 및 보안 →
# "그래도 열기"를 눌러야 한다(서명이 없으면 Gatekeeper가 "손상됨"이라며 아예 막는다).
# 공증하려면 "Developer ID Application" 인증서가 있어야 한다("Apple Development"는 안 된다).
# hardened runtime(공증 필수)은 entitlement 없이는 마이크를 막는다 → resources/macos/Hanji.entitlements.
run = '''
set -eu
ID="${MACOS_SIGN_IDENTITY:-$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)}"
if [ -z "$ID" ] || [ "$ID" = "-" ]; then
  echo "Developer ID Application 인증서가 없어 ad-hoc 서명한다(공증 불가)." >&2
  ID=-
fi
# vendor/cargo-bundle은 Cargo.lock을 커밋하지 않으므로(.gitignore) --locked를 붙이지 않는다.
cargo run --release --manifest-path vendor/cargo-bundle/Cargo.toml -- bundle --release --format osx
APP=target/release/bundle/osx/Hanji.app
# 파일 이름에 arm64(Apple Silicon)를 붙이므로 실행 파일이 arm64 전용인지 확인한다(Intel Mac에서 빌드하면 멈춘다).
ARCHS=$(lipo -archs "$APP/Contents/MacOS/hanji")
[ "$ARCHS" = "arm64" ] || { echo "실행 파일 아키텍처가 arm64가 아니다: $ARCHS" >&2; exit 1; }
VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
DMG=target/release/bundle/osx/Hanji-$VERSION-arm64.dmg
if [ "$ID" = "-" ]; then
  # ad-hoc 서명에는 타임스탬프를 붙일 수 없다.
  codesign --force --entitlements resources/macos/Hanji.entitlements -s - "$APP"
else
  codesign --force --options runtime --timestamp --entitlements resources/macos/Hanji.entitlements -s "$ID" "$APP"
fi
codesign --verify --strict --verbose=2 "$APP"
# dmg 안에 Applications 바로가기를 두어 끌어다 놓아 설치하게 한다.
STAGE=$(mktemp -d)
cp -R "$APP" "$STAGE/"
ln -s /Applications "$STAGE/Applications"
hdiutil create -volname Hanji -srcfolder "$STAGE" -ov -format UDZO "$DMG"
rm -rf "$STAGE"
[ "$ID" = "-" ] || codesign --force --timestamp -s "$ID" "$DMG"
echo "$DMG"
'''

[tasks.notarize]
description = "macOS: dmg를 공증하고 결과를 붙이기(staple) — GitHub 릴리스에 올릴 파일"
depends = ["dmg"]
# 공증 자격 증명은 앱이 아니라 Apple ID·팀 단위라 TT(../et)에서 저장해 둔 TT-notary 프로필을 같이 쓴다.
# 새 Mac이면 처음 한 번 키체인에 저장한다(앱 암호는 account.apple.com에서 만든다):
#   xcrun notarytool store-credentials TT-notary --apple-id drskur@gmail.com --team-id 2QMQ85P9Y6
# 다른 이름으로 저장했다면 NOTARY_PROFILE로 지정한다.
run = '''
set -eu
VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
DMG=target/release/bundle/osx/Hanji-$VERSION-arm64.dmg
codesign -dvv "$DMG" 2>&1 | grep -q "Authority=Developer ID Application" || { echo "dmg가 Developer ID로 서명되지 않아 공증할 수 없다(ad-hoc 서명이면 dmg를 그대로 올린다)." >&2; exit 1; }
xcrun notarytool submit "$DMG" --keychain-profile "${NOTARY_PROFILE:-TT-notary}" --wait
xcrun stapler staple "$DMG"
spctl --assess --type open --context context:primary-signature --verbose "$DMG"
echo "올리기: mise release"
'''

[tasks.release]
description = "GitHub 릴리스 v<버전>(초안)에 이 플랫폼의 설치 파일 올리기 — macOS dmg, Windows msi"
# 먼저 `mise notarize`(macOS)나 `mise bundle`(Windows)로 설치 파일을 만든다.
# 릴리스가 없으면 지금 커밋에 태그를 붙여 초안으로 만들고, 있으면 파일만 올린다(같은 이름은 덮어쓴다).
# 초안은 자동 업데이트에 보이지 않는다. 두 플랫폼 파일을 다 올린 뒤 `mise publish`로 공개한다.
# 태그는 GitHub 쪽에서 붙이므로 지금 커밋이 origin에 올라가 있어야 한다.
run = '''
set -eu
REPO=drskur-com/hanji
VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
TAG=v$VERSION
DMG=target/release/bundle/osx/Hanji-$VERSION-arm64.dmg
[ -f "$DMG" ] || { echo "$DMG 이 없다. 먼저 mise notarize." >&2; exit 1; }
xcrun stapler validate "$DMG" >/dev/null || { echo "$DMG 에 공증 결과가 붙어 있지 않다. mise notarize로 다시 만든다." >&2; exit 1; }
[ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "커밋하지 않은 변경이 있다." >&2; exit 1; }
COMMIT=$(git rev-parse HEAD)
git fetch -q origin
[ -n "$(git branch -r --contains "$COMMIT")" ] || { echo "지금 커밋($COMMIT)이 origin에 없다. 먼저 git push." >&2; exit 1; }
if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
  gh release upload "$TAG" "$DMG" -R "$REPO" --clobber
else
  gh release create "$TAG" "$DMG" -R "$REPO" --draft --target "$COMMIT" --title "Hanji $VERSION" --generate-notes
fi
gh release view "$TAG" -R "$REPO" --json url,isDraft,assets -q '.url, "draft: \(.isDraft)", (.assets[].name)'
'''
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1"

[tasks.publish]
description = "초안 릴리스 v<버전>을 공개하고 최신으로 표시하기 — 이때부터 자동 업데이트가 새 버전을 찾는다"
run = '''
set -eu
REPO=drskur-com/hanji
VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
TAG=v$VERSION
ASSETS=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name')
for NAME in "Hanji-$VERSION-arm64.dmg" "Hanji-$VERSION-x64.msi"; do
  echo "$ASSETS" | grep -qx "$NAME" || echo "주의: $NAME 이 릴리스에 없다(그 플랫폼은 업데이트를 받지 못한다)." >&2
done
gh release edit "$TAG" -R "$REPO" --draft=false --latest
gh release view "$TAG" -R "$REPO" --json url -q .url
'''
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -Publish"

[tasks.clean-cache]
description = "sccache 통계 확인"
run = "sccache --show-stats"
