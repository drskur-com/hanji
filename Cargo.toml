[package]
name = "hanji"
version = "0.3.1"
edition = "2024"
license = "MIT"

[dependencies]
# tree-sitter-*: 에디터 펜스 코드 블록 하이라이팅. markdown 문법이 펜스를 찾고 안쪽을 각 언어 문법에 넘긴다.
gpui-kit = { version = "0.8", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-sql",
    "tree-sitter-diff",
] }
# 하이라이터에 편집 내용(`InputEdit`)을 넘길 때 쓴다. 버전은 gpui-component와 맞춘다.
tree-sitter = "0.26"
# `LineStyle`처럼 gpui-kit이 다시 내보내지 않는 타입용. 버전은 gpui-kit과 맞춘다.
gpui-base = "0.8"
# UI 문자열 번역(`locales/<언어>/*.yml`). gpui-component와 같은 크레이트라 언어 설정을 함께 쓴다.
rust-i18n = "4"
sys-locale = "0.3"
# 확장 캔버스의 경로 측정·자르기·점선(ADR-0026). 버전은 gpui와 맞춘다.
lyon = "1.0"
# 확장 경로의 불리언 연산(합·차·교·XOR), 선 윤곽, 넓히기·좁히기.
i_overlay = "9"
# 확장의 모양 목록을 픽셀로 그린다: 화면, 어시스턴트가 보는 PNG, DOCX(ADR-0042).
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline"] }
# 플레이 창 확장의 소리(ADR-0040)와 에디터의 오디오 재생(ADR-0050). 확장 소리는 앱이 합성하고, 오디오 파일은
# symphonia 디코더(MP3·AAC/M4A·WAV·FLAC·Ogg Vorbis)로 푼다.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "wav", "flac", "vorbis"] }
dirs = "5"
# 대화 기록을 오늘·어제·지난 7일로 묶을 때 지역 날짜를 구한다.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ulid = "3"
notify = "8"
futures = "0.3"
markdown = "1"
trash = "5"
imagesize = "0.14"
# 썸네일 프레임(`gpui::RenderImage`)과 macOS 밖의 썸네일 대체 경로. 버전은 gpui와 맞춘다.
image = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
# PDF 내보내기(ADR-0014): 쓰기, 시스템 서체 찾기, 글자 유무·폭 확인.
krilla = "0.8"
fontdb = "0.23"
ttf-parser = "0.25"
# 웹 주소 이미지 읽기·내려받기용 HTTP 클라이언트. 버전은 gpui(gpui-pre)와 맞춘다.
reqwest_client = { version = "=0.3.9", package = "gpui-pre-reqwest-client" }
# 로컬 캐시(할 일 색인 등, ADR-0024): 동기화하지 않는 OS 캐시 폴더의 키-값 파일. 값은 JSON으로 넣는다.
redb = "4.4"
serde_json = "1"
# Alibaba Token Plan(OpenAI 호환 Chat Completions)은 rig의 공유 reqwest 클라이언트로 부른다.
rig-core = { version = "0.45", features = ["reqwest"] }
rig-bedrock = "0.45"
# 어시스턴트의 web_fetch: HTTP(rig와 같은 reqwest), HTML → 마크다운, 옛 문자 인코딩(EUC-KR 등).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
# 자동 업데이트: GitHub Releases 확인·내려받기·서명 확인·앱 교체.
hanji-update = { path = "crates/update" }
url = "2"
# 확장 그림의 그림 파일을 SVG(ePub)에 data URI로 넣는다(ADR-0044).
base64 = "0.22"
percent-encoding = "2"
htmd = "0.5"
encoding_rs = "0.8"
# rig-bedrock은 aws-config 기본 기능을 꺼서 credential_process·SSO 프로필을 못 읽는다. 직접 켜 둔다.
aws-config = { version = "1", features = ["behavior-version-latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "macros", "time", "fs"] }
aws-sdk-bedrock = "1"
unicode-normalization = "0.1.26"
similar = { version = "3.2.0", features = ["inline"] }
mlua = { version = "0.12.2", features = ["luau"] }
# 받아쓰기 모델(Nemotron GGUF)을 Hugging Face 캐시에 내려받는다(ADR-0054). `hf auth login` 토큰을 쓴다.
hf-hub = "1"
# 받아쓰기의 마이크·시스템 소리(루프백) 입력(ADR-0054). rodio와 같은 판이어야 네이티브 라이브러리(ALSA) 링크가 겹치지 않는다.
cpal = "0.18"
# 받아쓰기 인식(ADR-0054): transcribe.cpp(ggml)로 Nemotron GGUF를 스트리밍으로 돌린다. macOS는 Metal, 그 밖은 CPU.
transcribe-cpp = { version = "0.4", optional = true }
# 시트 본문 검색. ripgrep의 검색 엔진(grep-searcher + grep-regex)을 라이브러리로 쓴다.
grep = "0.4.1"
agent-client-protocol = "5.0.0"

# 번들 없이 실행할 때(`cargo run`)도 Dock에 앱 아이콘을 보인다. 버전은 gpui가 쓰는 것과 맞춘다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSDictionary", "NSError", "NSLocale", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSWindow", "NSView", "NSGraphics", "NSColor", "NSAppearance"] }
# 에디터의 YouTube 카드를 앱 창에서 재생한다(공식 iframe 플레이어, ADR-0052).
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKNavigation", "objc2-app-kit"] }
# 썸네일은 Finder와 같은 QuickLook으로 만든다(이미지·동영상, 시스템 캐시).
objc2-quick-look-thumbnailing = { version = "0.3", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"
# 에디터의 동영상 재생(ADR-0050): AVPlayer가 풀고, 프레임(CVPixelBuffer)을 gpui `paint_surface`로 그린다.
# objc2-core-video는 gpui와 같은 판이어야 프레임 타입이 맞는다.
# 받아쓰기의 마이크 권한 확인은 AVCaptureDevice로 한다(ADR-0054).
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVTime", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMSync"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "CVPixelBufferIOSurface"] }
# 이미지의 글자를 읽어 넣는다(OCR 텍스트, ADR-0053). 온디바이스 Vision 문자 인식.
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNDefines", "objc2-core-foundation"] }
# macOS 받아쓰기(ADR-0056): 기기 안의 SFSpeechRecognizer로 말하는 대로 받아 적고 발화 끝에서 문단을 나눈다.
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognitionMetadata", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }

# `cargo bundle --release`로 .app을 만든다.
[package.metadata.bundle]
name = "Hanji"
identifier = "com.drskur.hanji"
icon = ["resources/icon/hanji.icns", "resources/icon/hanji.png"]
category = "public.app-category.productivity"

[package.metadata.bundle.osx]
# 받아쓰기의 마이크·시스템 소리 녹음 사용 설명(ADR-0054). 없으면 macOS가 묻지 않고 막는다.
info_plist_exts = ["resources/macos/Info.plist.ext"]

[target.'cfg(target_os = "windows")'.dependencies]
# 이미지의 글자를 읽어 넣는다(OCR 텍스트, ADR-0053). WinRT `Windows.Media.Ocr`. 버전은 gpui가 쓰는 것과 맞춘다.
# Copilot+ PC에서는 Windows AI `TextRecognizer`(App SDK, 생성한 바인딩 `src/ocr/text_recognizer/bindings.rs`)를 먼저 쓴다.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_Com", "Win32_System_LibraryLoader"] }
windows-core = "0.62"
windows-future = "0.3"
# 받아쓰기 인식(ADR-0054)을 Vulkan으로 가속한다(AMD·NVIDIA·Intel, 내장 GPU 포함). 백엔드를 실행 중에 불러오는
# 빌드(`dynamic-backends`)라 Vulkan 드라이버가 없는 PC에서는 그 모듈만 건너뛰고 CPU로 돌며, CPU 모듈도 명령어
# 세트마다 따로 있어 빌드한 PC보다 오래된 CPU에서도 돈다. 빌드하는 PC에 Vulkan SDK(`glslc`)가 있어야 하고,
# 실행 파일 옆에 transcribe·ggml DLL을 함께 둔다(빌드가 `target/<profile>/`에 놓는다).
transcribe-cpp = { version = "0.4", features = ["vulkan", "dynamic-backends"], optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[features]
# 받아쓰기(ADR-0054). 화면에서 숨겼으므로 기본으로는 빌드하지 않는다. 켜면 transcribe.cpp를 빌드한다
# (Windows는 Vulkan SDK가 있어야 한다): `cargo run --features dictation`.
dictation = ["dep:transcribe-cpp"]

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# 제목 줄 확대를 위한 gpui-base 패치(PLAN §1.4).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
# Bedrock이 Claude의 도구 호출에 `"type": "tool_use"`를 붙이면서 rig-bedrock 0.45가 그것을 호스트 도구로
# 잘못 읽어 호출이 사라진다(답이 오지 않는다). streaming.rs 한 줄을 고친 사본. 고친 판이 나오면 지운다.
rig-bedrock = { path = "vendor/rig-bedrock" }
# 에디터 찾기(ctrl+F) 검색창에서 한글(IME)을 치면 입력한 글자가 사라진다. 검색창이 자기가 쓴 쿼리의
# 메아리를 바깥 변경으로 잘못 읽고 매 글자마다 `select_all`로 검색창을 다시 열기 때문이다. 검색창
# 패널(`input/overlay.rs`)의 메아리 판별에서 앵커·검색창 값 비교를 빼고 검색창이 세션에 마지막으로
# 쓴 쿼리(`input/search.rs`)를 보게 한 사본. 고친 판이 나오면 지운다.
gpui-component = { path = "vendor/gpui-component" }
