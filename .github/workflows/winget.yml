# 릴리스가 공개되면(`mise publish`) Hanji-<버전>-x64.msi로 microsoft/winget-pkgs에 새 버전 PR을 보낸다.
# 초안의 파일은 밖에서 내려받을 수 없으므로 빌드(windows-release.yml) 직후가 아니라 공개 뒤에 돈다.
# 처음 한 번은 `wingetcreate new`로 drskur.Hanji를 등록해 병합돼 있어야 한다.
# 필요한 것: winget-pkgs 포크, Secret WINGET_TOKEN(classic PAT, public_repo·workflow 범위).
# 포크가 저장소 주인(drskur-com)이 아닌 계정에 있으면 Variable WINGET_FORK_USER에 그 계정을 적는다.
name: WinGet

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 올릴 릴리스 태그 (예: v0.2.1)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: drskur.Hanji
          installers-regex: '^Hanji-.*-x64\.msi$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}
          token: ${{ secrets.WINGET_TOKEN }}
